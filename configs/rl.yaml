# PPO (Stable-Baselines3) on the fixed-base GR1 tasks, state observations, shaped reward.
task: reach_cup
algo: ppo
total_timesteps: 30000
n_envs: 1              # SubprocVecEnv if >1 (each env ~17 steps/s on the dev CPU)
n_steps: 512
batch_size: 128
n_epochs: 10
learning_rate: 3.0e-4
gamma: 0.99
gae_lambda: 0.95
ent_coef: 0.0
clip_range: 0.2
net_arch: [128, 128]
log_std_init: 0.0       # SB3 default (std=1). For ee_abs targets a smaller value (e.g. -1.5) explores less wildly
seed: 0
action_mode: ee_abs     # ee_abs | ee_delta (delta usually learns faster)
bc_init: null           # path to a BC checkpoint to distil into the PPO actor (demonstration-regularised refinement)
eval_episodes: 20
run_name: null
